name: Deploy Blog

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/ubuntu/nerdseverino.com.br
          git pull origin master
          docker compose down
          docker build -t nerdseverino-blog .
          docker compose up -d hugo
          sleep 5
          docker compose ps

    - name: Notify Telegram - Success
      if: success()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="Markdown" \
          -d text="✅ *Blog Deploy OK*%0A📝 ${{ github.event.head_commit.message }}%0A🔗 [Ver commit](${{ github.event.head_commit.url }})"

    - name: Notify Telegram - Failure
      if: failure()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="Markdown" \
          -d text="❌ *Blog Deploy FALHOU*%0A📝 ${{ github.event.head_commit.message }}%0A🔗 [Ver logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
